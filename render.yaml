# Render blueprint for the Harbor web app.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: harbor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --timeout 90
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: SECRET_KEY
        generateValue: true
      - key: RAG_BACKEND_URL
        sync: false
      - key: RAG_TIMEOUT
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: OPENAI_MODEL
        value: "gpt-4o-mini"
